              <div className="mb-6 rounded-2xl border border-slate-800 bg-slate-950 p-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-amber-400">{project.codeSnippet.title}</span>
                  <button
                    onClick={handleCopyCode}
                    className="flex items-center gap-1 text-[11px] font-bold text-slate-400 hover:text-white"
                  >
                    <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5" />
                    {copied ? 'Copied!' : 'Copy DAX'}
                  </button>
                </div>
                <pre className="text-xs font-mono text-emerald-300 overflow-x-auto p-3 bg-slate-900/80 rounded-xl">
                  {project.codeSnippet.code}
                </pre>
              </div>
            )}

            <div className="flex items-center gap-4 pt-4 border-t border-slate-800">
              <a
                href={project.githubUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs"
              >
                <Icon name="github" className="w-4 h-4" />
                View Code on GitHub
              </a>
            </div>
          </div>
        </div>
      );
    };

    const ResumeModal = ({ isOpen, onClose, darkMode }) => {
      if (!isOpen) return null;

      const profilePic = "Profile.jpg";

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md overflow-y-auto">
          <div className={`relative w-full max-w-4xl rounded-3xl border shadow-2xl p-6 sm:p-10 my-8 max-h-[90vh] overflow-y-auto ${
            darkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900'
          }`}>
            <div className="flex items-center justify-between pb-6 border-b border-slate-800">
              <h2 className="text-xl font-bold flex items-center gap-2">
                <Icon name="file-text" className="w-5 h-5 text-amber-500" />
                Curriculum Vitae — {PERSONAL_INFO.name}
              </h2>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => window.print()}
                  className="px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-950 text-slate-300 hover:text-white text-xs font-bold flex items-center gap-1.5"
                >
                  <Icon name="printer" className="w-3.5 h-3.5" />
                  Print CV
                </button>
                <button
                  onClick={onClose}
                  className="p-1.5 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>
            </div>

            <div className="py-6 space-y-6">
              <div className="flex flex-col sm:flex-row items-center gap-6 p-6 rounded-2xl bg-slate-950 border border-slate-800 text-white">
                <img src={profilePic} alt="Afaq Ali" className="w-20 h-20 rounded-full object-cover border-2 border-amber-500" />
                <div>
                  <h1 className="text-2xl font-black">{PERSONAL_INFO.name}</h1>
                  <p className="text-amber-400 font-bold text-sm">{PERSONAL_INFO.title}</p>
                  <p className="flex items-center gap-4 mt-2 text-xs font-semibold text-amber-400">{PERSONAL_INFO.location} • {PERSONAL_INFO.email}</p>
                  <div className="flex items-center gap-4 mt-2 text-xs font-semibold text-amber-400">
                    <a href={PERSONAL_INFO.github} target="_blank" rel="noopener noreferrer" className="hover:underline">github.com/iamafaqali</a>
                    <span>•</span>
                    <a href={PERSONAL_INFO.linkedin} target="_blank" rel="noopener noreferrer" className="hover:underline">linkedin.com/in/iamafaqali</a>
                  </div>
                </div>
              </div>

              <div>
                <h3 className="text-xs font-bold uppercase tracking-widest text-amber-500 mb-2">Professional Summary</h3>
                <p className="text-xs sm:text-sm leading-relaxed text-slate-300">{PERSONAL_INFO.bio}</p>
              </div>

              <div>
                <h3 className="text-xs font-bold uppercase tracking-widest text-amber-500 mb-3">Professional Experience</h3>
                <div className="space-y-4">
                  {EXPERIENCES.map(exp => (
                    <div key={exp.id} className="p-4 rounded-xl border border-slate-800 bg-slate-950/50">
                      <div className="flex justify-between items-start">
                        <div>
                          <h4 className="font-bold text-sm text-white">{exp.role}</h4>
                          <p className="text-xs text-amber-400 font-semibold">{exp.company}</p>
                        </div>
                        <span className="text-[11px] font-bold text-slate-400">{exp.period}</span>
                      </div>
                      <ul className="mt-2 space-y-1">
                        {exp.description.map((d, i) => (
                          <li key={i} className="text-xs text-slate-300">• {d}</li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <h3 className="text-xs font-bold uppercase tracking-widest text-amber-500 mb-2">Education</h3>
                  <div className="p-4 rounded-xl border border-slate-800 bg-slate-950/50">
                    <h4 className="font-bold text-sm text-white">{EDUCATION[0].degree}</h4>
                    <p className="text-xs text-amber-400">{EDUCATION[0].institution}</p>
                    <p className="text-xs text-slate-400 mt-1">{EDUCATION[0].details}</p>
                  </div>
                </div>
                <div>
                  <h3 className="text-xs font-bold uppercase tracking-widest text-amber-500 mb-2">Certifications</h3>
                  <div className="p-4 rounded-xl border border-slate-800 bg-slate-950/50">
                    <h4 className="font-bold text-sm text-white">{CERTIFICATIONS[0].title}</h4>
                    <p className="text-xs text-amber-400">{CERTIFICATIONS[0].issuer}</p>
                    <p className="text-xs text-slate-400 mt-1">{CERTIFICATIONS[0].duration}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [darkMode, setDarkMode] = useState(true);
      const [selectedProject, setSelectedProject] = useState(null);
      const [isResumeOpen, setIsResumeOpen] = useState(false);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      return (
        <div className={darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}>
          <Navbar darkMode={darkMode} setDarkMode={setDarkMode} setIsResumeOpen={setIsResumeOpen} />
          <main>
            <Hero darkMode={darkMode} setIsResumeOpen={setIsResumeOpen} />
            <About darkMode={darkMode} />
            <Skills darkMode={darkMode} />
            <Projects darkMode={darkMode} setSelectedProject={setSelectedProject} />
            <Experience darkMode={darkMode} />
            <Contact darkMode={darkMode} />
          </main>
          <Footer darkMode={darkMode} />

          <ProjectModal
            project={selectedProject}
            onClose={() => setSelectedProject(null)}
            darkMode={darkMode}
          />

          <ResumeModal
            isOpen={isResumeOpen}
            onClose={() => setIsResumeOpen(false)}
            darkMode={darkMode}
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
